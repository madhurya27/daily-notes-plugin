name: Release

# Obsidian requires the tag to equal the manifest version exactly, with no
# leading "v". `pnpm version` writes both through version-bump.mjs.
on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20
                  cache: pnpm

            - name: Check the tag matches the manifest version
              run: |
                  manifest_version="$(node -p "require('./manifest.json').version")"
                  if [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version" >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the plugin
              run: pnpm run build

            - name: Create the draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Individual assets, not a zip: this is what Obsidian downloads.
              run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft main.js manifest.json styles.css
